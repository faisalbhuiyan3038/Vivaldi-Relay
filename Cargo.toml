[package]
name = "vivaldi_mod_interceptor"
version = "0.1.4"
edition = "2021"

[lib]
name = "vivaldi_mod_interceptor"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12"
windows-sys = { version = "0.59", features = [
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_Foundation",
    "Win32_Security"
] }

[[bin]]
name = "interceptor"
path = "src/main.rs"

[[bin]]
name = "webui"
path = "src/webui/main.rs"
